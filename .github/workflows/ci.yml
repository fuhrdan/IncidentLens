name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

  api:
    name: API and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/IncidentLens.Api.Tests/IncidentLens.Api.Tests.csproj
      - run: dotnet build tests/IncidentLens.Api.Tests/IncidentLens.Api.Tests.csproj --configuration Release --no-restore
      - run: dotnet test tests/IncidentLens.Api.Tests/IncidentLens.Api.Tests.csproj --configuration Release --no-build
      - name: Audit direct and transitive NuGet dependencies
        run: |
          dotnet list api/IncidentLens.Api.csproj package --vulnerable --include-transitive --format json > /tmp/incidentlens-nuget.json
          python3 scripts/check_nuget_vulnerabilities.py /tmp/incidentlens-nuget.json
      - run: dotnet tool restore
      - name: Validate PostgreSQL migrations
        env:
          Database__Provider: PostgreSql
          ASPNETCORE_ENVIRONMENT: Production
        run: dotnet tool run dotnet-ef migrations script --idempotent --project api --startup-project api --output /tmp/incidentlens.sql

  hardening:
    name: Hardening harness and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/hardening -v

  release:
    name: GA release consistency and smoke safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests/release -v

  recovery:
    name: Recovery CLI safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/recovery -v

  recovery-drill:
    name: PostgreSQL backup and restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidentlens
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: incidentlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidentlens"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: incidentlens
      PGPASSWORD: integration-only
      PGDATABASE: incidentlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: psql --no-psqlrc --set ON_ERROR_STOP=1 -f tests/recovery/fixture.sql
      - run: mkdir -m 700 -p /tmp/incidentlens-drill
      - run: python scripts/recovery.py drill --output-dir /tmp/incidentlens-drill

  deployment:
    name: Production deployment references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python -m unittest discover -s tests/deployment -v
      - name: Validate Compose interpolation
        run: |
          cp deploy/.env.example .env
          docker compose config --quiet
          rm -f .env
      - name: Build production images
        run: |
          docker build -f api/Dockerfile -t incidentlens-api:1.0.0 .
          docker build -f web/Dockerfile -t incidentlens-web:1.0.0 .
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform syntax and provider validation
        working-directory: infra/terraform/kubernetes
        run: |
          terraform fmt -recursive
          terraform init -backend=false
          terraform validate
