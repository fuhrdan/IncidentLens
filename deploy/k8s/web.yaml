apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: incidentlens
spec:
  replicas: 1
  selector:
    matchLabels: { app: incidentlens-web }
  template:
    metadata:
      labels: { app: incidentlens-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/REPLACE_ME/incidentlens-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: incidentlens
spec:
  selector: { app: incidentlens-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
