# Internal reverse proxy, reached only through the HTTPS edge/ingress.
# API service name "api" works in Compose and in the Kubernetes namespace.
# The application exempts internal health probes from quota. Apply a small
# public-edge budget to the DB-backed readiness URL to prevent DB-probe abuse.
limit_req_zone $binary_remote_addr zone=incidentlens_health:10m rate=5r/s;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /health/ready {
        limit_req zone=incidentlens_health burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080/health/ready;
    }

    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
    }

    location ^~ /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~* \.(?:css|js|woff2|png|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control 'public, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-store';
    }
}
